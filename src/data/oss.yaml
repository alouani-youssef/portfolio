- id: ai-stones
  logo: ../assets/oss/ai-stones/logo.png
  name: AI Stones
  order: 1
  related: en/ai-stones
  pitch: "An AI harness for Claude Code: Markdown skills, guardrail hooks and JSON settings that protect and improve how the model operates."
  languages: [Markdown, JSON, Hook scripts]
  license: MIT
  repos: [{ label: GitHub, url: "https://github.com/alouani-youssef/stones" }]
  links: [{ label: npm, url: "https://www.npmjs.com/package/ai-stones" }]
  highlights:
    - "Guardrail hooks: access guard, blocked rm, atomic commits, and a gate that holds merges and publishes until local CI passes."
    - "24 skills that load only when a task needs them, from test-first development to system prompts and golden sets."
    - "Installed per project with npx ai-stones init, tailored to the detected stack; MIT on npm."
- id: archio
  logo: ../assets/oss/archio/logo.jpeg
  name: archio
  order: 2
  related: en/archio
  pitch: "Object storage in Go with a multi-node, high-availability cluster and semantic search over stored files, built on Docling."
  languages: [Go]
  license: Apache-2.0
  repos: [{ label: GitHub, url: "https://github.com/alouani-youssef/archio" }]
  highlights:
    - "File processing, storage and delivery optimisation."
    - "Multi-node cluster setup for high availability."
    - "Semantic search over documents, built on Docling."
- id: translator
  logo: ../assets/oss/translator/logo.jpeg
  name: translator
  order: 3
  pitch: "Low-cost, context-aware translation: NLLB-200 for simple text, an LLM above a complexity threshold, behind a three-tier cache."
  languages: [Python]
  license: Apache-2.0
  repos: [{ label: GitHub, url: "https://github.com/alouani-youssef/translator" }]
  highlights:
    - "FastAPI service routing between NLLB-200 3.3B and an LLM (Gemini, Ollama or OpenRouter) by complexity."
    - "Exact, normalized and semantic cache on PostgreSQL with pgvector."
    - "Semantic search exposed to the LLM as a tool that fetches validated translation examples, lifting domain accuracy even with local LLMs."
    - "multilingual-e5 quality scoring; S3/MinIO JSON documents."
