- id: tracking-kit
  logo: ../assets/oss/tracking-kit/logo.jpg
  status: Used in production
  media:
    - { src: ../assets/oss/tracking-kit/illustration.jpeg, alt: "Illustration of server-side tracking: a browser window sends events to a secured server and database, which feed analytics charts" }
  name: Tracking kit
  order: 4
  pitch: "A Go/Gin user-recognition service and a TypeScript browser SDK, with every event HMAC-signed."
  languages: [Go (Gin), TypeScript]
  license: Apache-2.0
  repos:
    - { label: tracker, url: "https://github.com/alouani-youssef/tracker" }
    - { label: tracking-sdk, url: "https://github.com/alouani-youssef/tracking-sdk" }
  highlights:
    - "Gin service that receives and verifies tracking events for user recognition."
