name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build:preview
      - run: npm run test:dist
      - name: Check internal links
        run: npx linkinator dist --recurse --skip "^https?://(?!(localhost|127\.0\.0\.1))"
      - name: Lighthouse (95+ on every category)
        run: npx lhci autorun

  production-build:
    # Fails while any case-study metric is still a placeholder. Kept visible, not blocking,
    # until Youssef confirms the numbers; then remove continue-on-error.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
